name: Module range

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  module-range:
    name: Module range
    uses: noldova-com/desktop/.github/workflows/module-range.yml@de9381ea754987409fd4e9fd0e554f3f2eb5398b # v0.0.12
    permissions:
      contents: read
      issues: write
    with:
      module: src/noldova.checkpoints
      build: npm run peers:newest && npm run build
