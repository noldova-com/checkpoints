name: Module range

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  module-range:
    name: Module range
    uses: noldova-com/desktop/.github/workflows/module-range.yml@043393ccb64798aeee6223c72c4ada4fad6f1b47 # v0.0.12
    permissions:
      contents: read
      issues: write
    with:
      module: src/noldova.checkpoints
      build: npm run peers:newest && npm run build
